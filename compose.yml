services:
  postgres:
    image: postgres:17-alpine
    container_name: sportsmatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sportsmatch}
      POSTGRES_USER: ${POSTGRES_USER:-sportsmatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sportsmatch_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sportsmatch_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sportsmatch} -d ${POSTGRES_DB:-sportsmatch}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sportsmatch_postgres_data:
