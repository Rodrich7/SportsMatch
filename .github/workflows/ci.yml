name: Integracion continua

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: Probar y construir
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sportsmatch
          POSTGRES_USER: sportsmatch
          POSTGRES_PASSWORD: sportsmatch_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sportsmatch -d sportsmatch"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v6

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Dar permiso de ejecucion al wrapper
        run: chmod +x gradlew

      - name: Ejecutar pruebas y generar build
        run: ./gradlew build --no-daemon
